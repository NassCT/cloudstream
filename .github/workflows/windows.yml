name: Windows Build

on:
  push:
    branches: [master]
    tags: ["desktop-v*"]
    paths:
      - "desktopApp/**"
      - "library/**"
      - "shared/**"
      - "gradle/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # libVLC (LGPL) is copied into the app by the prepareVlc task for the built-in player
      - name: Install VLC (bundled libVLC)
        shell: pwsh
        run: choco install vlc -y --no-progress

      - name: Build installer (exe + msi) and portable app
        shell: pwsh
        run: ./gradlew.bat :desktopApp:packageExe :desktopApp:packageMsi :desktopApp:createDistributable --console=plain

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path desktopApp/build/compose/binaries/main/app/CloudStreamPlus -DestinationPath CloudStreamPlus-portable-windows.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CloudStreamPlus-windows
          path: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
            CloudStreamPlus-portable-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
            CloudStreamPlus-portable-windows.zip
